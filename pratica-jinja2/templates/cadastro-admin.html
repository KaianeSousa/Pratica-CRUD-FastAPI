<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/cadastro.css">
    <title>Cadastro</title>
</head>
<body>
<div class="cadastro-container">
    <h2>Cadastro</h2>
    <form id="formulario">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Crie uma senha" required>


        <button type="submit" class="botao-cadastro">Cadastrar</button>
        <div class="login-link">
            <a href="/">Já tem uma conta? Faça login</a>
        </div>
    </form>
</div>

</body>
<script src="../static/js/cadastro-admin.js"></script>
</html>
