<!DOCTYPE html> 
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/cadastro.css">
    <script src="../static/js/cadastro.js" defer></script>

    <title>Banco de Coleta e Doação de Sangue</title>
</head>
<body>

<div class="container">
    <h2>Bem-vindo a Sistema de Doação de Sangue</h2>
    <h3>Por favor, insira seus dados abaixo</h3>
    <div class="lbCadastro">
        <form method="POST">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required/>
            </div>

            <div>
                <label for="idade">Idade:</label>
                <input type="text" id="idade" name="idade" required/>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required/>
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required/>
            </div>  
             
            <div>
                <label id="lbSanguineo" for="tipo_sanguineo">Tipo Sanguíneo:</label>
                <select id="tipo_sanguineo" name="tipo_sanguineo" required>
                    <option value="" selected disabled>Selecione um tipo de sangue</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="RH-nulo">RH Nulo-</option>
                </select>
            </div>  

            <div>
                <label for="papel">Cadastrar como:</label>
                <select id="papel" name="papel" required>
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="Doador">Doador</option>
                    <option value="Receptor">Receptor</option>
                </select>
            </div> 

            <button id="btnCadastrar" type="button">
                <a href="/" class="btnCadastrar">Cadastrar</a> 
            </button>

            <button id="btnCancelar" type="button">
                <a href="/" class="btnCancelar">Cancelar</a> 
            </button>
        </form>       
    </div>
</div>

</body>
</html>
