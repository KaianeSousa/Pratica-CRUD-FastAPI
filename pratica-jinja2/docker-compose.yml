
services:
  app:
    networks:
      - net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doacoes
    ports:
      - '8000:8000'
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env


  db:
    image: postgres
    networks:
      - net
    ports:
      - "5435:5435"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  net:
    driver: bridge
